const TH_D=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
function fd(d){if(!d)return '—';const [y,m,dd]=d.slice(0,10).split('-').map(Number);return `${dd} ${TH_M[m-1]} ${y+543}`}
function fdl(d){const dt=new Date(d+'T00:00:00');return `${TH_D[dt.getDay()]} ${fd(d)}`}
function addMonths(d,n){const [y,m,dd]=d.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1+n,dd));return dt.toISOString().slice(0,10)}
const money=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:0});
const bt=v=>{const [d,t]=v.split(' ');const [y,m,dd]=d.split('-');return `${dd}/${m} ${t}`};
const nowStamp=()=>TODAY+' '+new Date().toTimeString().slice(0,5);
function lit(k,v){if(v===null||v===undefined||v==='')return 'NULL';if(typeof v==='number')return String(v);return (NV.has(k)?"N'":"'")+String(v).replace(/'/g,"''")+"'"}
function ins(t,o){const ks=Object.keys(o);return `INSERT INTO ${t} (${ks.join(', ')})\nVALUES (${ks.map(k=>k==='password_hash'?"CONVERT(VARCHAR(255), HASHBYTES('SHA2_256', @password), 2)":lit(k,o[k])).join(', ')});`}

function login(u){const a=DB.user_account.find(x=>x.username===u);S.user=a;S.roster=null}

function me(){return S.user&&S.user.role==='Member'?DB.member.find(m=>m.user_id===S.user.user_id):null}

function head(){

  if(r==='Member') items=[['classes','ตารางคลาส'],['me','การจองของฉัน'],['plans','แพ็กเกจ']];
  if(r==='Trainer') items=[['t-classes','คลาสของฉัน']];
  if(r==='Admin') items=[['a-dash','Dashboard'],['a-schedule','ตารางคลาส'],['a-plans','แพ็กเกจ'],['a-members','สมาชิก']];
  let name=S.user.username; const m=me(), t=meT(); if(m)name=m.first_name; if(t)name='ครู'+t.first_name;
  return `<div class="apphead"><span class="logo">FitPulse<small>Club</small></span><nav class="nav">${items.map(i=>`<button data-go="${i[0]}" class="${S.view===i[0]?'on':''}">${i[1]}</button>`).join('')}</nav>
   <span class="who">${esc(name)} <span class="pill n">${r}</span><button data-act="logout">ออกจากระบบ</button></span></div>`;
}
function flash(){if(!S.flash)return '';const f=S.flash;S.flash=null;return `<div class="msg ${f.k}" role="status">${f.t}</div>`}
function render(keepSql){

}

function bookClass(sid){
  const m=me(),s=DB.class_schedule.find(x=>x.schedule_id===sid),t=ctype(s.class_type_id),p=m.plan_id?plan(m.plan_id):null;
  const base=exFrom('classes',{});
  if(!m.end_date||m.end_date<s.class_date){S.flash={k:'bad',t:'ยังจองไม่ได้ เพราะแพ็กเกจหมดอายุก่อนวันเรียน หรือยังไม่ได้เลือกแพ็กเกจ'};go('classes');
    explain(Object.assign(base,{title:'จองไม่ผ่าน: สถานะสมาชิก',sql:`-- ตรวจสถานะสมาชิกก่อนจอง (Derived จาก end_date)\nSELECT end_date FROM member WHERE member_id = ${m.member_id};`,attrs:{MEM:['วันหมดอายุ','สถานะสมาชิก']},say:`ก่อนจอง ระบบดู <b>สถานะสมาชิก</b> ซึ่งคำนวณจากวันหมดอายุของ ${E('MEMBER')} ถ้ายังไม่มีแพ็กเกจหรือหมดอายุก่อนวันเรียน จะไม่สร้างแถวใน CLASS_BOOKING`}));return}
  if(p&&p.class_quota!==null){const ym=s.class_date.slice(0,7);const used=DB.class_booking.filter(b=>b.member_id===m.member_id&&['Booked','Attended','NoShow'].includes(b.booking_status)&&DB.class_schedule.find(x=>x.schedule_id===b.schedule_id).class_date.slice(0,7)===ym).length;
    if(used>=p.class_quota){S.flash={k:'bad',t:`จองไม่ได้ ใช้โควตาเดือนนี้ครบ ${p.class_quota} ครั้งแล้ว`};go('classes');return}}
  const b=booked(sid),full=b>=s.max_capacity,pos=full?waitN(sid)+1:null;
  const row={booking_id:nextId('class_booking','booking_id'),member_id:m.member_id,schedule_id:sid,booking_time:nowStamp(),booking_status:full?'Waitlist':'Booked',waitlist_position:pos};
  const old=DB.class_booking.find(x=>x.member_id===m.member_id&&x.schedule_id===sid);
  let sql=`-- 1) นับที่จองแล้ว: ${b} จาก ${s.max_capacity} ที่ → ${full?'เต็ม เข้าคิวรอ':'ยังว่าง'}\n`;
  if(old){Object.assign(old,{booking_time:row.booking_time,booking_status:row.booking_status,waitlist_position:pos});
    sql+=`-- 2) เคยจองรอบนี้แล้วยกเลิก (UNIQUE member_id + schedule_id) จึงแก้แถวเดิม\nUPDATE class_booking\nSET booking_status = '${row.booking_status}', waitlist_position = ${pos??'NULL'}, booking_time = GETDATE()\nWHERE booking_id = ${old.booking_id};`}
  else{DB.class_booking.push(row);sql+='-- 2) เพิ่มการจอง\n'+ins('class_booking',{member_id:m.member_id,schedule_id:sid,booking_status:row.booking_status,waitlist_position:pos})}
  if(!full&&b+1>=s.max_capacity){s.schedule_status='Full';sql+=`\n\n-- 3) ที่นั่งเต็มพอดี\nUPDATE class_schedule SET schedule_status = 'Full' WHERE schedule_id = ${sid};`}
  S.flash={k:full?'warn':'ok',t:full?`${t.type_name} เต็มแล้ว คุณอยู่คิวรอที่ ${pos}`:`จอง ${t.type_name} ${fdl(s.class_date)} ${s.start_time} สำเร็จ`};go('classes');
  explain(Object.assign(base,{title:full?'คลาสเต็ม → เข้าคิวรอ':'จองคลาสสำเร็จ',sql,attrs:{BOOK:['รหัสการจอง','เวลาที่จอง','สถานะการจอง','ลำดับคิวรอ'],SCHED:['จำนวนที่นั่งสูงสุด','จำนวนที่จองแล้ว']},
   say:`กดจอง 1 ครั้ง = เพิ่ม 1 แถวใน ${E('CLASS_BOOKING')} ที่เก็บ member_id (เส้น <b>จอง</b>) และ schedule_id (เส้น <b>ถูกจองใน</b>) เป็น Foreign Key ทั้งคู่ ฝั่ง CLASS_BOOKING เป็นเส้นคู่ เพราะการจองต้องมีทั้งคนจองและรอบคลาสเสมอ<br>ก่อนบันทึก ระบบนับ <b>จำนวนที่จองแล้ว</b> (Derived) = ${b} เทียบกับ <b>จำนวนที่นั่งสูงสุด</b> = ${s.max_capacity} ${full?`ที่นั่งเต็ม จึงบันทึกเป็น <b>Waitlist</b> พร้อมลำดับคิวรอ = ${pos}`:`ยังว่าง จึงบันทึกเป็น <b>Booked</b>`}`}));
}
function cancelBooking(id){
  const bk=DB.class_booking.find(x=>x.booking_id===id),s=DB.class_schedule.find(x=>x.schedule_id===bk.schedule_id),wasBooked=bk.booking_status==='Booked',oldPos=bk.waitlist_position;
  bk.booking_status='Cancelled';bk.waitlist_position=null;
  let sql=`UPDATE class_booking\nSET booking_status = 'Cancelled', waitlist_position = NULL\nWHERE booking_id = ${id};`, extra='';
  const q=DB.class_booking.filter(x=>x.schedule_id===s.schedule_id&&x.booking_status==='Waitlist').sort((a,b)=>a.waitlist_position-b.waitlist_position);
  if(wasBooked&&q.length){const f=q[0];f.booking_status='Booked';f.waitlist_position=null;q.slice(1).forEach(x=>x.waitlist_position--);const fm=mem(f.member_id);
    sql+=`\n\n-- มีคิวรอ: เลื่อนคิวแรกขึ้นมาเป็น Booked\nUPDATE class_booking\nSET booking_status = 'Booked', waitlist_position = NULL\nWHERE booking_id = ${f.booking_id};\n\nUPDATE class_booking\nSET waitlist_position = waitlist_position - 1\nWHERE schedule_id = ${s.schedule_id} AND booking_status = 'Waitlist';`;
    extra=`<br>รอบนี้มีคิวรออยู่ ระบบจึงเลื่อนคุณ${esc(fm.first_name)} (คิวที่ 1) ขึ้นมาเป็น Booked แทน แล้วขยับคิวที่เหลือขึ้น 1 ลำดับ`}
  else if(!wasBooked){q.filter(x=>x.waitlist_position>oldPos).forEach(x=>x.waitlist_position--)}
  else if(s.schedule_status==='Full'&&booked(s.schedule_id)<s.max_capacity){s.schedule_status='Open';sql+=`\n\nUPDATE class_schedule SET schedule_status = 'Open' WHERE schedule_id = ${s.schedule_id};`}
  S.flash={k:'ok',t:'ยกเลิกการจองแล้ว'};const v=S.view;go(v);
  explain(exFrom(v,{title:'ยกเลิกการจอง',sql,attrs:{BOOK:['สถานะการจอง','ลำดับคิวรอ']},rels:['R4','R5'],ents:['MEM','BOOK','SCHED'],
   say:`ยกเลิกไม่ได้ลบแถวออกจาก ${E('CLASS_BOOKING')} แต่แก้ booking_status เป็น <b>Cancelled</b> เพื่อเก็บประวัติไว้ ที่นั่งจึงว่างเพิ่ม 1 ที่ เพราะจำนวนที่จองแล้ว (Derived) นับเฉพาะ Booked กับ Attended${extra}`}));
}

document.addEventListener('submit',e=>{
  const f=e.target; if(!f.closest('#app'))return; e.preventDefault();
  if(f.id==='f-login'){const u=val('lu'),p=val('lp');S.form.lu=u;const a=DB.user_account.find(x=>x.username===u&&x.pw===p);
    const sql=`DECLARE @username VARCHAR(50) = '${u.replace(/'/g,"''")}';\nSELECT user_id, role, account_status\nFROM user_account\nWHERE username = @username\n  AND password_hash = CONVERT(VARCHAR(255), HASHBYTES('SHA2_256', @password), 2);`;
    if(!a){S.flash={k:'bad',t:'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง ลองใหม่อีกครั้ง'};go('login');explain(exFrom('login',{title:'Log in ไม่ผ่าน',sql:sql+'\n-- ไม่พบแถว → ชื่อผู้ใช้หรือรหัสผ่านผิด'}));return}
    if(a.account_status!=='Active'){S.flash={k:'warn',t:a.account_status==='Pending'?'บัญชีนี้กำลังรอ Admin อนุมัติ ยังเข้าระบบไม่ได้':'ใบสมัครนี้ถูกปฏิเสธแล้ว'};go('login');
      explain(exFrom('login',{title:'บัญชียังไม่ Active',sql:sql+`\n-- พบแถว: role = '${a.role}', account_status = '${a.account_status}'`,say:`พบบัญชี <b>${esc(u)}</b> ใน ${E('USER_ACCOUNT')} แต่ <b>สถานะบัญชี = '${a.account_status}'</b> ${a.account_status==='Pending'?'เพราะเป็นเทรนเนอร์ที่สมัครแล้วแต่ Admin ยังไม่อนุมัติ':''} ระบบจึงไม่ให้เข้า ถ้าอยากให้เข้าได้ ต้องให้ Admin อนุมัติก่อน (ขั้น 8)`}));return}
    login(u);S.form.lu='';const dest=a.role==='Admin'?'a-dash':a.role==='Trainer'?'t-classes':(me().plan_id?'classes':'plans');
    const why=a.role==='Admin'?'ไปหน้าหลังบ้าน':a.role==='Trainer'?'ไปหน้าคลาสของเทรนเนอร์':(me().plan_id?'สมาชิกคนนี้มีแพ็กเกจแล้ว จึงไปหน้าตารางคลาส':'สมาชิกคนนี้ยังไม่มีแพ็กเกจ (plan_id เป็น NULL) จึงไปหน้าเลือกแพ็กเกจ');
    go(dest);explain(exFrom('login',{title:'Log in สำเร็จ',sql:sql+`\n-- พบแถว: user_id = ${a.user_id}, role = '${a.role}', account_status = 'Active'`,
      say:`ระบบพบบัญชี <b>${esc(u)}</b> ใน ${E('USER_ACCOUNT')} รหัสผ่านตรง และสถานะบัญชีเป็น Active<br>จากนั้นอ่าน <b>บทบาท = '${a.role}'</b> → ${why}<br>เลื่อนลงดูหน้าใหม่ทางซ้าย แล้วแผงนี้จะเปลี่ยนเป็นคำอธิบายของหน้านั้นเมื่อกดเมนู`}));return}
  if(f.id==='f-reg'||f.id==='f-app'){const isReg=f.id==='f-reg';const P=isReg?'r_':'a_';const phones=readPhones().filter(Boolean);
    const d={fn:val(P+'fn'),ln:val(P+'ln'),em:val(P+'em'),u:val(P+'u'),pw:val(P+'p')};
    if(isReg){d.bd=val('r_bd');d.g=val('r_g')}else{d.sp=val('a_sp');d.ex=val('a_ex')}
    saveForm(isReg?'reg':'app',isReg?['r_fn','r_ln','r_em','r_bd','r_g','r_u']:['a_fn','a_ln','a_em','a_sp','a_ex','a_u']);S.phones=readPhones();
    let err='';
    if(!d.fn||!d.ln||!d.em||!d.u||!d.pw||(isReg&&(!d.bd||!d.g))||(!isReg&&(!d.sp||d.ex==='')))err='กรอกช่องที่มี * ให้ครบ';
    else if(!phones.length)err='ใส่เบอร์โทรอย่างน้อย 1 เบอร์';
    else if(new Set(phones).size!==phones.length)err='มีเบอร์โทรซ้ำกัน';
    else if(d.pw.length<6)err='รหัสผ่านต้องมีอย่างน้อย 6 ตัว';
    else if(DB.user_account.some(a=>a.username===d.u))err=`ชื่อผู้ใช้ ${d.u} มีคนใช้แล้ว ลองชื่ออื่น`;
    else if((isReg?DB.member:DB.trainer).some(x=>x.email===d.em))err='อีเมลนี้ลงทะเบียนแล้ว';
    else if(!isReg&&+d.ex<0)err='ประสบการณ์ต้องไม่ติดลบ';
    if(err){S.flash={k:'bad',t:err};render(true);return}
    const uid=nextId('user_account','user_id');
    DB.user_account.push({user_id:uid,username:d.u,pw:d.pw,role:isReg?'Member':'Trainer',account_status:isReg?'Active':'Pending',created_at:nowStamp()});
    let sql=`-- 1) สร้างบัญชี\nDECLARE @password VARCHAR(100) = '••••••';\n`+ins('user_account',{username:d.u,password_hash:1,role:isReg?'Member':'Trainer',account_status:isReg?'Active':'Pending'})+`\n-- ได้ user_id = ${uid}\n\n`;
    if(isReg){const mid=nextId('member','member_id');DB.member.push({member_id:mid,user_id:uid,first_name:d.fn,last_name:d.ln,email:d.em,birth_date:d.bd,gender:d.g,plan_id:null,start_date:null,end_date:null});
      phones.forEach(ph=>DB.member_phone.push({member_id:mid,phone:ph}));
      sql+=`-- 2) สร้างสมาชิก (FK user_id) ยังไม่มีแพ็กเกจ\n`+ins('member',{user_id:uid,first_name:d.fn,last_name:d.ln,email:d.em,birth_date:d.bd,gender:d.g,plan_id:null})+`\n-- ได้ member_id = ${mid}\n\n-- 3) เบอร์โทร (Multi-valued) เบอร์ละ 1 แถว\n`+phones.map(ph=>ins('member_phone',{member_id:mid,phone:ph})).join('\n');}
    else{const tid=nextId('trainer','trainer_id');DB.trainer.push({trainer_id:tid,user_id:uid,first_name:d.fn,last_name:d.ln,email:d.em,specialization:d.sp,experience_years:+d.ex,hire_date:null});
      phones.forEach(ph=>DB.trainer_phone.push({trainer_id:tid,phone:ph}));
      sql+=`-- 2) สร้างเทรนเนอร์ (FK user_id) ยังไม่มีวันเริ่มงาน\n`+ins('trainer',{user_id:uid,first_name:d.fn,last_name:d.ln,email:d.em,specialization:d.sp,experience_years:+d.ex,hire_date:null})+`\n-- ได้ trainer_id = ${tid}\n\n-- 3) เบอร์โทร (Multi-valued)\n`+phones.map(ph=>ins('trainer_phone',{trainer_id:tid,phone:ph})).join('\n');}
    S.form[isReg?'reg':'app']={};S.phones=null;S.form.lu=d.u;
    S.flash={k:'ok',t:isReg?`ลงทะเบียนสำเร็จ Log in ด้วย ${d.u} ได้เลย`:`ส่งใบสมัครแล้ว รอ Admin อนุมัติก่อนจึง Log in ได้`};go('login');
    explain(exFrom(isReg?'register':'apply',{title:isReg?'บันทึกการลงทะเบียน':'บันทึกใบสมัครเทรนเนอร์',sql,
      say:isReg?`กดลงทะเบียนแล้ว ระบบบันทึก 3 ตารางตามลำดับ<br>1) ${E('USER_ACCOUNT')} ได้ user_id = ${uid} role = 'Member'<br>2) ${E('MEMBER')} ที่เก็บ user_id = ${uid} เป็น Foreign Key นี่คือเส้น <b>ใช้บัญชี</b> 1:1 (user_id ใน member เป็น UNIQUE)<br>3) member_phone ${phones.length} แถว ตามจำนวนเบอร์ เพราะเบอร์โทรเป็น Multi-valued<br>plan_id ยังเป็น NULL เพราะยังไม่ได้เลือกแพ็กเกจ ตรงกับเส้นเดียว (Partial) ฝั่ง MEMBER ของเส้น <b>เลือก</b> ต่อไปให้ Log in ด้วยบัญชีนี้`
        :`บันทึก 3 ตารางเหมือนสมาชิก แต่บัญชีใน ${E('USER_ACCOUNT')} ได้ role = 'Trainer' และสถานะ <b>'Pending'</b> ส่วน ${E('TRAINER')} ยังไม่มีวันเริ่มงาน ถ้าลอง Log in ตอนนี้จะเข้าไม่ได้ ต้องให้ Admin อนุมัติก่อน (ขั้น 8)`}));return}
  if(f.id==='f-sch'){saveForm('sch',['s_t','s_tr','s_r','s_d','s_st','s_en','s_c']);const d=S.form.sch;let err='';
    if(!d.s_r||!d.s_d||!d.s_st||!d.s_en||!d.s_c)err='กรอกให้ครบทุกช่อง';else if(d.s_en<=d.s_st)err='เวลาสิ้นสุดต้องหลังเวลาเริ่ม';else if(+d.s_c<=0)err='ที่นั่งต้องมากกว่า 0';
    if(err){S.flash={k:'bad',t:err};render(true);return}
    const row={schedule_id:nextId('class_schedule','schedule_id'),class_type_id:+d.s_t,trainer_id:+d.s_tr,room_name:d.s_r,class_date:d.s_d,start_time:d.s_st,end_time:d.s_en,max_capacity:+d.s_c,schedule_status:'Open'};
    DB.class_schedule.push(row);S.flash={k:'ok',t:`เพิ่ม ${ctype(row.class_type_id).type_name} ${fd(row.class_date)} ${row.start_time} แล้ว สมาชิกจองได้ทันที`};go('a-schedule');
    explain(exFrom('a-schedule',{title:'บันทึกรอบคลาสใหม่',sql:ins('class_schedule',{class_type_id:row.class_type_id,trainer_id:row.trainer_id,room_name:row.room_name,class_date:row.class_date,start_time:row.start_time,end_time:row.end_time,max_capacity:row.max_capacity})+`\n-- ได้ schedule_id = ${row.schedule_id}`,
     say:`ได้แถวใหม่ใน ${E('CLASS_SCHEDULE')} ที่ชี้ไป ${E('CLASS_TYPE')} (class_type_id = ${row.class_type_id}, ${esc(ctype(row.class_type_id).type_name)}) และ ${E('TRAINER')} (trainer_id = ${row.trainer_id}, ครู${esc(trn(row.trainer_id).first_name)}) ลองไป Log in เป็นสมาชิก (ขั้น 4) จะเห็นคลาสนี้ในตารางคลาส และเทรนเนอร์คนนี้จะเห็นในหน้าคลาสของตัวเอง`}));return}
  if(f.id==='f-pl'){saveForm('pl',['p_n','p_m','p_pr','p_b','p_q']);const d=S.form.pl;let err='';
    if(!d.p_n||!d.p_m||d.p_pr==='')err='กรอกชื่อ ระยะเวลา และราคา';else if(+d.p_m<=0)err='ระยะเวลาต้องมากกว่า 0';else if(DB.membership_plan.some(p=>p.plan_name===d.p_n))err='ชื่อแพ็กเกจซ้ำ';
    if(err){S.flash={k:'bad',t:err};render(true);return}
    const row={plan_id:nextId('membership_plan','plan_id'),plan_name:d.p_n,duration_months:+d.p_m,price:+d.p_pr,billing_type:d.p_b,class_quota:d.p_q===''?null:+d.p_q,is_active:1};
    DB.membership_plan.push(row);S.form.pl={};S.flash={k:'ok',t:`เพิ่ม ${row.plan_name} แล้ว`};go('a-plans');
    explain(exFrom('a-plans',{title:'เพิ่มแพ็กเกจ',sql:ins('membership_plan',{plan_name:row.plan_name,duration_months:row.duration_months,price:row.price,billing_type:row.billing_type,class_quota:row.class_quota})}));return}
});

renderSteps();go('login');
})();
